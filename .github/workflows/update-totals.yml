name: Update Sheet Totals

on:
  schedule:
    # Every 6 hours. Adjust as needed.
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  GOOGLE_SERVICE_EMAIL: ${{ secrets.GOOGLE_SERVICE_EMAIL }}
  GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}

jobs:
  update-totals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Update TOTALS tab
        run: node scripts/update-totals.mjs
