name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # Required for vite build (client-side)
  VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
  VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
  VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
  VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
  VITE_EMAILJS_CONTACT_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_CONTACT_TEMPLATE_ID }}
  VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
  VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
  RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
  ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
  # Required for server-side API (used at runtime, not build time)
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  GOOGLE_SERVICE_EMAIL: ${{ secrets.GOOGLE_SERVICE_EMAIL }}
  GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
  RECAPTCHA_SECRET_KEY: ${{ secrets.RECAPTCHA_SECRET_KEY }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      # `npm ci` doesn't reliably install platform-specific optional
      # dependencies (e.g. @tailwindcss/oxide-linux-x64-gnu on the CI
      # runner), so we run `npm install --include=optional` afterwards
      # to fetch the right one for the current platform.
      - run: npm ci
      - run: npm install --include=optional --no-audit --no-fund

      # Step 1: Lint check
      - name: Lint
        run: npm run lint

      # Step 2: Format check
      - name: Format check
        run: npm run format:check

      # Step 3: TypeScript check
      - name: TypeScript check
        run: npm run typecheck

      # Step 4: Install platform-specific Tailwind binary
      # `npm ci` doesn't reliably install platform-specific optional
      # deps. Force-install the right binary before the build step.
      - name: Install Tailwind native binary
        run: npm install --no-save --force --include=optional @tailwindcss/oxide-linux-x64-gnu

      # Step 5: Unit tests
      - name: Run unit tests
        run: npm test

      # Step 6: Build (also validates env vars via verify-env.mjs)
      - name: Build production bundle
        run: npm run build

  deploy:
    # Only deploy on push to main (not PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `npm ci` doesn't reliably install platform-specific optional
      # dependencies. Force-install the right platform binary using
      # `--force` to bypass platform constraints, since the lockfile
      # was generated on macOS but the CI runs on Linux.
      - run: npm install --no-save --force --include=optional @tailwindcss/oxide-linux-x64-gnu
      - run: npm install --include=optional --no-audit --no-fund

      # Step 3: Build for deploy
      - name: Build production bundle
        run: |
          npm run build
          echo "=== dist/ contents ==="
          ls -la dist/ | head -15
          echo "=== dist/index.html (first 5 lines) ==="
          head -5 dist/index.html
          echo "=== Verify index.html exists ==="
          test -f dist/index.html && echo "✓ dist/index.html exists" || echo "✗ dist/index.html MISSING"

      # Step 4: Install Puppeteer for E2E tests
      - name: Install Puppeteer
        run: npm install --no-save puppeteer

      # Step 5: Start preview server for E2E tests
      - name: Start preview server
        run: |
          # Make sure the platform-specific Tailwind binary is present
          # (puppeteer install in the previous step can occasionally
          # trigger npm to prune optional deps).
          npm install --no-save --include=optional @tailwindcss/oxide-linux-x64-gnu 2>&1 | tail -3
          ls node_modules/@tailwindcss/oxide-linux-x64-gnu/ 2>&1 || echo "binary NOT found"
          npx vite preview --port 3002 > /tmp/preview.log 2>&1 &
          sleep 5
          cat /tmp/preview.log | head -10
          curl -sS -o /dev/null -w "preview status: %{http_code}\n" http://localhost:3002 || echo "preview NOT responding"

      # Step 6: Run E2E tests against preview server
      - name: Run E2E tests
        run: node scripts/deploy-e2e.mjs http://localhost:3002

      # Step 7: Visual preview check (2 mobile screenshots)
      - name: Visual preview check
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SCREENSHOT_RECIPIENT: ${{ secrets.NOTIFICATION_EMAIL }}
        run: |
          npx playwright install chromium
          node scripts/preview-check.mjs http://localhost:3002

      # Step 8: Upload preview screenshots as artifacts
      - name: Upload preview screenshots
        uses: actions/upload-artifact@v4
        with:
          name: preview-screenshots
          path: screenshots/
          retention-days: 14

      # Step 9: Wait for Vercel auto-deploy to publish github.sha to production
      # Vercel auto-deploys on push to the production branch (main).
      # No CLI step — the CLI hangs on the Hobby plan. We poll the API instead.
      # Non-fatal: if Vercel doesn't pick up the commit (e.g. dashboard issue),
      # the smoke test still runs against the current production. CI fails only
      # if the production smoke test fails, which would catch a real regression.
      - name: Wait for Vercel auto-deploy
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROJECT_ID: prj_1alSAVdV4DgibUJwPVzgLYp5EWK7
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for i in {1..40}; do
            curl -sS "https://api.vercel.com/v6/deployments?projectId=$PROJECT_ID&target=production&limit=1" \
              -H "Authorization: Bearer $VERCEL_TOKEN" > /tmp/d.json
            STATE=$(python3 -c "import json; d=json.load(open('/tmp/d.json')); print(d['deployments'][0]['state'] if d.get('deployments') else 'NONE')")
            SHA=$(python3 -c "import json; d=json.load(open('/tmp/d.json')); print(d['deployments'][0].get('meta', {}).get('githubCommitSha', '') if d.get('deployments') else '')")
            echo "  attempt $i: state=$STATE sha=$SHA"
            if [ "$STATE" = "READY" ] && [ "$SHA" = "$COMMIT_SHA" ]; then
              echo "  Vercel deployed $COMMIT_SHA"
              exit 0
            fi
            if [ $i -eq 40 ]; then
              echo "Timed out waiting for Vercel auto-deploy of $COMMIT_SHA"
              exit 1
            fi
            sleep 5
          done

      # Step 10: Smoke test against production
      - name: E2E smoke test on production
        run: |
          sleep 5
          node scripts/deploy-e2e.mjs https://abhayandrebecca.com

